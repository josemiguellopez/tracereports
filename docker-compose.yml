# docker compose up -d   →   http://localhost:8080
# La configuración se lee de un archivo .env junto a este (ver .env.example). Sin TRACEREPORTS_TOKEN
# o el login de la UI en el .env, el servidor no arranca (quedaría abierto: ver docs, Seguridad).
services:
  tracereports:
    build: .
    image: tracereports:latest
    ports:
      # solo accesible desde este equipo (o desde un proxy HTTPS en el mismo servidor), por IPv4 e
      # IPv6: sin [::1], en Windows cada conexión a "localhost" espera ~2 s antes de caer a IPv4.
      # Para abrirlo a la red sin proxy usa "8080:8080", siempre con token y login en el .env.
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - tracereports-data:/data     # base de datos SQLite + capturas
    env_file:
      - path: .env
        required: false
    environment:
      # siempre en el volumen, aunque el .env traiga el DATA_DIR de go run (environment manda sobre env_file)
      DATA_DIR: /data
    restart: unless-stopped
    # endurecido: el sistema de archivos es de solo lectura (se escribe solo en /data y en /tmp), sin
    # capabilities de Linux y sin poder ganar privilegios (setuid). Ver docs: security-hardening
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/tracereports", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # LLM local opcional (docker compose --profile llm up -d): llama.cpp server con un modelo GGUF que
  # descargas antes en ./models (ver docs: local-ai). Sin puertos publicados: solo TraceReports lo
  # alcanza (AI_PROVIDER=openai_compatible, AI_BASE_URL=http://llm:8080/v1). No descarga nada al
  # correr: el modelo se monta de solo lectura.
  llm:
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
    command: ["-m", "/models/${LLM_MODEL_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "--jinja"]
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tracereports-data:
    name: tracereports-data         # nombre fijo, sin prefijo de carpeta (el mismo que con docker run)
