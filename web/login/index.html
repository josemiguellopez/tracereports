<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Ingresar · TraceReports</title>
	<link rel="stylesheet" href="/vendor/fonts/fonts.css">
	<link rel="stylesheet" href="/login/login.css">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' fill='%23c9fa6b'/%3E%3Cpath fill='%2318200d' d='M6 6h20v5h-7v15h-6V11H6z'/%3E%3Cpath fill='%236c9736' d='M22 22h5v5h-5z'/%3E%3C/svg%3E">
	<script src="/login/login.js" type="module"></script>
</head>
<body>
	<!-- depth 0-3: el lienzo donde los workers arman una traza en vivo (decorativo) -->
	<div class="stage" aria-hidden="true">
		<canvas id="stage"></canvas>
		<div class="ruler ruler-top"></div>
		<div class="ruler ruler-left"></div>
	</div>

	<main class="shell">
		<!-- depth 4: el mensaje, abajo a la izquierda sobre el lienzo -->
		<section class="pitch" aria-hidden="true">
			<p class="kicker"><span class="dot"></span><span data-t="kicker">6 AGENTES EJECUTANDO</span> <span class="mono" id="clock">--:--:--</span></p>
			<h1 data-t="title">Lo que falló, por qué y dónde.</h1>
			<p class="lede" data-t="lede">Pasos, red, DOM y capturas de cada test, en el mismo lugar.</p>
		</section>

		<!-- depth 4: el formulario; Trace Buddy, asomado encima -->
		<section class="card" aria-labelledby="login-title">
			<div class="buddy" id="buddy" aria-hidden="true"><img class="buddy-still" src="/buddy/tracebuddy-avatar.webp" alt=""></div>
			<header class="brand">
				<span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" shape-rendering="crispEdges"><rect width="32" height="32" fill="#c9fa6b"/><path fill="#18200d" d="M6 6h20v5h-7v15h-6V11H6z"/><path fill="#6c9736" d="M22 22h5v5h-5z"/></svg></span>
				<span class="word">tracereports<span class="caret">_</span></span>
			</header>
			<h2 id="login-title" data-t="h">Ingresar</h2>
			<p class="sub" id="sub" data-t="sub">Usa la cuenta configurada en este servidor.</p>
			<p class="notice" id="notice" role="status" hidden></p>

			<form id="form" novalidate>
				<label class="field">
					<span class="label" data-t="user">Usuario</span>
					<input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="200">
				</label>
				<label class="field">
					<span class="label" data-t="pass">Clave</span>
					<span class="pw">
						<input id="pass" name="password" type="password" autocomplete="current-password" required maxlength="500">
						<button type="button" class="eye" id="eye" aria-pressed="false" aria-controls="pass">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path class="lid" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="iris" cx="12" cy="12" r="3.2"/><path class="slash" d="M4 4l16 16"/></svg>
							<span class="sr" id="eye-label" data-t="show">Mostrar clave</span>
						</button>
					</span>
					<span class="caps" id="caps" hidden data-t="caps">Bloq Mayús activado</span>
				</label>
				<label class="remember">
					<input type="checkbox" id="remember">
					<span class="switch" aria-hidden="true"><i></i></span>
					<span><span data-t="remember">Recordarme</span> <span class="muted" id="remember-days"></span></span>
				</label>
				<button class="go" id="go" type="submit">
					<span class="go-text" data-t="go">Ingresar</span>
					<span class="go-spin" aria-hidden="true"></span>
					<svg class="go-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
				</button>
				<p class="error" id="error" role="alert" aria-live="assertive"></p>
			</form>

			<footer class="foot">
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
				<span id="policy" data-t="policy">Sesión en cookie segura.</span>
			</footer>
		</section>
	</main>
	<noscript><p class="nojs">TraceReports necesita JavaScript para ingresar.</p></noscript>
</body>
</html>
