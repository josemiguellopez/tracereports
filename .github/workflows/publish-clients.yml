name: Publish clients

# Manual: Actions → Publish clients → Run workflow. Sin tokens: PyPI y npm confían en este
# workflow (Trusted Publishing con OIDC).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        type: choice
        options: [pypi, npm, both]
        default: both

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI
    if: inputs.target == 'pypi' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # los permisos del job reemplazan a los globales
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build client/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: client/python/dist

  npm:
    name: npm
    if: inputs.target == 'npm' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read   # los permisos del job reemplazan a los globales
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing necesita npm 11.5.1 o superior: viene incluido en Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        working-directory: client/js
