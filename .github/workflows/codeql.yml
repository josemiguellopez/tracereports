name: CodeQL

# Análisis estático (SAST) del servidor, la UI y los clientes. Los hallazgos aparecen en
# Security → Code scanning.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # los lunes: reglas nuevas sobre código que no cambió

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # subir los resultados
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript # web/, client/js, test/e2e
            build-mode: none
          - language: python # client/python
            build-mode: none
          - language: java-kotlin # client/java (sin compilar: no hace falta Gradle aquí)
            build-mode: none
          - language: actions # los propios workflows
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
