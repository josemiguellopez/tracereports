name: OpenSSF Scorecard

# Puntaje público de buenas prácticas de seguridad del repositorio (badge en el README).
# Solo corre en la rama por defecto: es lo que mide y publica Scorecard.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # resultados en Code scanning
      id-token: write # publicar el puntaje (api.scorecard.dev)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
