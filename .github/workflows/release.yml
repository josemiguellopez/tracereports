name: Release

# Al publicar un tag vX.Y.Z: binarios en GitHub Releases y la imagen en ghcr.io, con SBOM, firma
# keyless (cosign) y provenance (SLSA). Un tag con guion (v0.6.0-rc1) es un pre-release: no mueve
# `latest` ni la línea X.Y. Cómo verificar: SECURITY.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el release
      id-token: write # firma keyless (cosign) y provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # el último parche de Go: los binarios llevan la librería estándar con sus arreglos de seguridad
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      # las notas del release son la sección del CHANGELOG de esta versión, no la lista de commits;
      # un pre-release (v0.6.0-rc1) usa la sección [Unreleased]
      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in *-*) section="Unreleased" ;; *) section="$v" ;; esac
          awk -v v="$section" 'index($0, "## [" v "]")==1 {on=1; next} on && index($0, "## [")==1 {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has no section for $section"; exit 1; fi
          printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "$GITHUB_REF_NAME")" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # provenance SLSA de cada archivo del release (gh attestation verify)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar en ghcr.io
      id-token: write # firma keyless y provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # SBOM y provenance de BuildKit, adjuntos a la imagen en el registro
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # se firma el digest, no un tag (un tag puede moverse)
      - run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
