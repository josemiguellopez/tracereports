name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # el último parche de la misma línea que el Dockerfile (golang:1.27-alpine): go.mod solo fija
      # el mínimo, y compilar con ese .0 dejaría fuera los arreglos de seguridad de la librería estándar
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - name: El binario compila sin CGO
        run: go build -o /dev/null ./cmd
        env:
          CGO_ENABLED: "0"

  server-race:
    name: Server (Go, race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      # necesita CGO solo para compilar los tests; el binario publicado sigue siendo estático
      # (CGO_ENABLED=0 en .goreleaser.yaml y en el Dockerfile)
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  govulncheck:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      # falla solo con vulnerabilidades alcanzables desde el código (módulos y librería estándar)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: client/go

  compose:
    name: Docker (hardened compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      # el perfil opcional del LLM local (llama.cpp server)
      - run: docker compose --profile llm config --quiet
      # sin credenciales el contenedor no arranca (fail-closed): con un token, sí
      - name: Start the hardened container
        run: |
          echo "TRACEREPORTS_TOKEN=$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 240
      - name: Read-only, no capabilities, no new privileges
        run: |
          id=$(docker compose ps -q tracereports)
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
          docker inspect -f '{{.HostConfig.CapDrop}}' "$id" | grep -q ALL
          docker inspect -f '{{.HostConfig.SecurityOpt}}' "$id" | grep -q no-new-privileges
          test "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy
      - name: It receives a run (writes only in /data and /tmp)
        run: |
          token=$(sed -n 's/^TRACEREPORTS_TOKEN=//p' .env)
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"compose hardened"}' http://127.0.0.1:8080/api/v1/runs
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/v1/runs | grep -q 'compose hardened'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  client-python:
    name: Client (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      # versiones fijadas por hash (.github/requirements); el cliente es local y no tiene dependencias
      - run: |
          pip install --require-hashes -r .github/requirements/ci.txt
          pip install --no-deps ./client/python
      # navegadores reales: las capturas enmascaradas se verifican en los píxeles (test_mask.py)
      - run: python -m playwright install --with-deps chromium
      - run: pytest client/python/tests

  client-js:
    name: Client (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      # navegador real: las capturas enmascaradas se verifican en los píxeles (test/mask.test.js)
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: test/e2e
      - run: npm test
        working-directory: client/js
      # los tipos publicados (index.d.ts) aceptan lo que acepta el runtime
      - run: npm run typecheck
        working-directory: client/js

  web-unit:
    name: Web UI (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "test/web/*.test.js"

  web-e2e:
    name: Web UI (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: test/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: test/e2e
      - run: npx playwright test
        working-directory: test/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7

  client-java:
    name: Client (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cada gradle-wrapper.jar del repo es uno publicado por Gradle (checksum oficial), antes de ejecutarlo
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      # navegador real: las capturas tapadas se verifican en los píxeles (MaskTest)
      - run: ./gradlew installChromium
        working-directory: client/java
      - run: ./gradlew test
        working-directory: client/java

  client-go:
    name: Client (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go/go.mod
      - run: go test ./...
        working-directory: client/go
