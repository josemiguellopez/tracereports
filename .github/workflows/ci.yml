name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  client-python:
    name: Client (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      - run: pip install pytest pytest-xdist ./client/python
      - run: pytest client/python/tests

  client-js:
    name: Client (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      - run: npm test
        working-directory: client/js

  web-unit:
    name: Web UI (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test "test/web/*.test.js"

  web-e2e:
    name: Web UI (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: test/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: test/e2e
      - run: npx playwright test
        working-directory: test/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7

  client-java:
    name: Client (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      - run: ./gradlew test
        working-directory: client/java

  client-go:
    name: Client (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # el binario (tracereports report) para los tests de grabación sin servidor de punta a punta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/tracereports" ./cmd && echo "TRACEREPORTS_BIN=$RUNNER_TEMP/tracereports" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go/go.mod
      - run: go test ./...
        working-directory: client/go
