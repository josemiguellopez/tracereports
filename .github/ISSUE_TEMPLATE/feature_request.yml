name: 💡 Feature request
description: Suggest an idea or a new integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! You can write in English or Spanish.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us about the situation. "When my nightly run fails, I have to…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, with some guidance"
        - "No, just suggesting"
