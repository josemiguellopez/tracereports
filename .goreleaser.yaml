version: 2

project_name: tracereports

builds:
  - main: ./cmd
    binary: tracereports
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - .env.example

checksum:
  name_template: checksums.txt

# SBOM (SPDX, con syft) de cada archivo publicado: qué módulos y versiones lleva el binario
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# firma keyless con cosign (identidad OIDC del workflow de release, sin claves que guardar): se
# firma checksums.txt, que a su vez cubre cada archivo. Verificación: SECURITY.md
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  # vX.Y.Z-rc1 y similares se publican como pre-release, nunca como la versión vigente
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
